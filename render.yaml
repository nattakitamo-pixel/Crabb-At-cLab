services:
  - type: web
    name: crabb-at-clab
    runtime: node
    plan: starter          # ต้องใช้แพลนเสียเงินจึงมี Disk เก็บข้อมูลถาวร (ประมาณ 7 ดอลลาร์/เดือน)
    buildCommand: echo "no build"
    startCommand: node server.js
    envVars:
      - key: DATA_FILE
        value: /var/data/data.json
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
