<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ec4ee">
<title>เช็คชื่อรับ-ส่งพนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1c3f77;--blue:#2f6fc4;--sky:#dcecfa;--sky2:#bfe0f7;--yellow:#ffd95a;--cream:#fff6d6;--bg:#f4f9fe;--ok:#2e9e5b;--danger:#d24b4b;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--navy);background:linear-gradient(#bfe0f7,#f4f9fe 260px) no-repeat,var(--bg);min-height:100vh;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:18px 0 8px}
.duck{font-size:40px;line-height:1}
h1{margin:4px 0 0;font-size:22px;font-weight:800}
.badge{display:inline-block;margin-top:8px;background:var(--yellow);border-radius:999px;padding:6px 18px;font-weight:800;box-shadow:0 2px 0 rgba(28,63,119,.15)}
.tabs{display:flex;gap:8px;margin:14px 0;position:sticky;top:0;padding:8px 0;background:linear-gradient(#cfe7f8,#cfe7f8e0);z-index:5;backdrop-filter:blur(6px)}
.tabs button{flex:1;border:0;border-radius:999px;padding:12px;font:inherit;font-weight:800;background:#fff;color:var(--navy);font-size:16px}
.tabs button.on{background:var(--navy);color:#fff}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(28,63,119,.10);margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--navy);border:2px solid var(--sky2);border-radius:14px;padding:12px;background:#fbfdff}
input:focus,textarea:focus{outline:0;border-color:var(--blue)}
textarea{min-height:84px;resize:vertical}
.hint{font-size:13px;opacity:.7;margin-top:4px}
.btn{border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:800;font-size:16px;background:var(--navy);color:#fff;width:100%;margin-top:16px}
.btn.yellow{background:var(--yellow);color:var(--navy)}
.btn.ghost{background:var(--sky);color:var(--navy);margin-top:8px}
.btn.small{width:auto;padding:8px 14px;font-size:14px;margin:0}
.btn.danger{background:#fde4e4;color:var(--danger)}
.seg{display:flex;background:var(--sky);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px;font:inherit;font-weight:800;color:var(--navy)}
.seg button.on{background:var(--blue);color:#fff}
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.bar{height:12px;background:var(--sky);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.group h3{margin:16px 4px 8px;font-size:16px;display:flex;justify-content:space-between}
.group h3 span{background:var(--cream);border-radius:999px;padding:2px 12px;font-size:14px}
.row{display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(28,63,119,.08);border:2px solid transparent}
.row.done{background:#eaf8ef;border-color:#bfe6cc}
.row.done .nm{text-decoration:line-through;opacity:.65}
.row.mine{border-color:var(--yellow)}
.chk{flex:none;width:40px;height:40px;border-radius:12px;border:3px solid var(--blue);background:#fff;display:grid;place-items:center;font-size:24px;color:#fff;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px;word-break:break-word}
.pt{font-size:14px;opacity:.75}
.note{margin-top:6px;background:var(--cream);border-radius:10px;padding:6px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.edit{flex:none;border:0;background:var(--sky);border-radius:10px;width:36px;height:36px;font-size:16px}
.empty{text-align:center;padding:30px 10px;opacity:.7}
.actions{display:flex;gap:8px}
.actions .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="duck">🐥</div>
    <h1>เช็คชื่อรับ-ส่งพนักงาน</h1>
    <div class="badge" id="badge"></div>
  </header>

  <nav class="tabs">
    <button id="tab-reg" class="on">✍️ ลงชื่อ</button>
    <button id="tab-chk">✅ เช็คชื่อ</button>
  </nav>

  <!-- ลงชื่อ -->
  <section id="view-reg">
    <form class="card" id="form" autocomplete="off">
      <b id="form-title" style="font-size:18px">ลงชื่อของคุณ</b>
      <label for="f-name">ชื่อ</label>
      <input id="f-name" required maxlength="60" placeholder="เช่น สมชาย ใจดี">
      <label for="f-point">จุดรับ-ส่ง (เลือกได้จุดเดียว)</label>
      <input id="f-point" required maxlength="80" list="points" placeholder="พิมพ์หรือเลือกจุดที่มีอยู่">
      <datalist id="points"></datalist>
      <div class="hint">พิมพ์จุดใหม่ได้ หรือเลือกจากจุดที่คนอื่นลงไว้แล้ว</div>
      <label for="f-note">หมายเหตุ</label>
      <textarea id="f-note" maxlength="300" placeholder="เช่น วันนี้มาไม่ได้ / เปลี่ยนจุดรับเป็น… / ข้อมูลอื่นๆ"></textarea>
      <button class="btn yellow" id="f-submit" type="submit">บันทึก</button>
      <button class="btn ghost hidden" id="f-cancel" type="button">ยกเลิกการแก้ไข</button>
      <button class="btn danger hidden" id="f-delete" type="button" style="margin-top:8px">ลบชื่อนี้</button>
    </form>
  </section>

  <!-- เช็คชื่อ -->
  <section id="view-chk" class="hidden">
    <div class="seg">
      <button id="m-pickup">🚌 รอบรับ</button>
      <button id="m-dropoff">🏠 รอบส่ง</button>
    </div>
    <div class="progress"><span id="prog-text"></span><span id="prog-pct"></span></div>
    <div class="bar"><i id="prog-bar" style="width:0"></i></div>
    <div id="list"></div>
    <button class="btn danger" id="reset" style="margin-top:20px">🔄 รีเซ็ตเครื่องหมาย (เริ่มรอบใหม่)</button>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = { mode: 'pickup', people: [] };
let editingId = null;
let mine = localStorage.getItem('myId') || null;
let busy = false;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const modeLabel = () => (state.mode === 'pickup' ? 'รอบรับ' : 'รอบส่ง');

async function load() {
  if (busy) return;
  try { state = await api('GET', '/api/state'); render(); } catch (_) {}
}

function render() {
  $('badge').textContent = modeLabel();
  $('m-pickup').classList.toggle('on', state.mode === 'pickup');
  $('m-dropoff').classList.toggle('on', state.mode === 'dropoff');
  const pts = [...new Set(state.people.map((p) => p.point))].sort((a, b) => a.localeCompare(b, 'th'));
  $('points').innerHTML = pts.map((p) => `<option value="${esc(p)}">`).join('');

  const done = state.people.filter((p) => p.checked).length, total = state.people.length;
  $('prog-text').textContent = `${modeLabel()}แล้ว ${done} / ${total} คน`;
  $('prog-pct').textContent = total ? Math.round((done / total) * 100) + '%' : '';
  $('prog-bar').style.width = total ? (done / total) * 100 + '%' : '0';

  if (!total) { $('list').innerHTML = '<div class="empty">🐥 ยังไม่มีรายชื่อ<br>ไปที่แท็บ “ลงชื่อ” ได้เลย</div>'; return; }
  const groups = {};
  state.people.forEach((p) => (groups[p.point] = groups[p.point] || []).push(p));
  $('list').innerHTML = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'th')).map((pt) => {
    const arr = groups[pt].sort((a, b) => a.name.localeCompare(b.name, 'th'));
    const d = arr.filter((p) => p.checked).length;
    return `<div class="group"><h3>📍 ${esc(pt)}<span>${d}/${arr.length}</span></h3>` + arr.map((p) => `
      <div class="row ${p.checked ? 'done' : ''} ${p.id === mine ? 'mine' : ''}">
        <button class="chk" data-check="${p.id}" aria-label="ยืนยัน">${p.checked ? '✓' : ''}</button>
        <div class="info"><div class="nm">${esc(p.name)}</div>
          ${p.note ? `<div class="note">📝 ${esc(p.note)}</div>` : ''}</div>
        <button class="edit" data-edit="${p.id}" aria-label="แก้ไข">✏️</button>
      </div>`).join('') + '</div>';
  }).join('');
}

function show(tab) {
  $('view-reg').classList.toggle('hidden', tab !== 'reg');
  $('view-chk').classList.toggle('hidden', tab !== 'chk');
  $('tab-reg').classList.toggle('on', tab === 'reg');
  $('tab-chk').classList.toggle('on', tab === 'chk');
  window.scrollTo(0, 0);
}
$('tab-reg').onclick = () => show('reg');
$('tab-chk').onclick = () => show('chk');

function startEdit(id) {
  const p = state.people.find((x) => x.id === id); if (!p) return;
  editingId = id;
  $('f-name').value = p.name; $('f-point').value = p.point; $('f-note').value = p.note;
  $('form-title').textContent = 'แก้ไขข้อมูล';
  $('f-submit').textContent = 'บันทึกการแก้ไข';
  $('f-cancel').classList.remove('hidden'); $('f-delete').classList.remove('hidden');
  show('reg');
}
function endEdit() {
  editingId = null; $('form').reset();
  $('form-title').textContent = 'ลงชื่อของคุณ'; $('f-submit').textContent = 'บันทึก';
  $('f-cancel').classList.add('hidden'); $('f-delete').classList.add('hidden');
}
$('f-cancel').onclick = endEdit;

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const body = { name: $('f-name').value, point: $('f-point').value, note: $('f-note').value };
  try {
    if (editingId) { await api('PUT', '/api/people/' + editingId, body); toast('แก้ไขเรียบร้อย'); }
    else { const p = await api('POST', '/api/people', body); mine = p.id; localStorage.setItem('myId', mine); toast('ลงชื่อเรียบร้อย 🐥'); }
    endEdit(); await load();
  } catch (err) { toast(err.message); }
};
$('f-delete').onclick = async () => {
  if (!confirm('ลบชื่อนี้ออกจากรายการ?')) return;
  try { await api('DELETE', '/api/people/' + editingId); if (mine === editingId) { mine = null; localStorage.removeItem('myId'); } endEdit(); toast('ลบแล้ว'); await load(); }
  catch (err) { toast(err.message); }
};

$('list').addEventListener('click', async (e) => {
  const c = e.target.closest('[data-check]'), ed = e.target.closest('[data-edit]');
  if (ed) return startEdit(ed.dataset.edit);
  if (!c) return;
  const p = state.people.find((x) => x.id === c.dataset.check); if (!p) return;
  p.checked = !p.checked; render(); // อัปเดตทันที
  busy = true;
  try { await api('POST', `/api/people/${p.id}/check`, { checked: p.checked }); }
  catch (err) { toast(err.message); }
  busy = false; load();
});

$('m-pickup').onclick = () => setMode('pickup');
$('m-dropoff').onclick = () => setMode('dropoff');
async function setMode(m) { try { state = await api('POST', '/api/mode', { mode: m }); render(); } catch (err) { toast(err.message); } }

$('reset').onclick = async () => {
  if (!confirm('รีเซ็ตเครื่องหมายทุกคนเพื่อเริ่มรอบใหม่?')) return;
  try { state = await api('POST', '/api/reset'); render(); toast('รีเซ็ตแล้ว พร้อมรอบใหม่'); } catch (err) { toast(err.message); }
};

load();
setInterval(load, 4000);
</script>
</body>
</html>
